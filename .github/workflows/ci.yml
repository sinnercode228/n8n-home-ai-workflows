name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Code nodes are generated from src/ (no drift)
        run: npm run check:build

      - name: Validate workflow JSON
        run: npm run validate

      - name: Unit + mock workflow tests
        run: npm test

      - name: docker-compose.yml is valid
        if: matrix.node == 24
        run: |
          cp .env.example .env
          sed -i 's/^N8N_ENCRYPTION_KEY=$/N8N_ENCRYPTION_KEY=ci-only-not-a-secret/' .env
          docker compose --profile ollama --profile qdrant --profile proxy config -q
          bash -n scripts/backup.sh
